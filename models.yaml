# Arabic Failure Atlas — model roster: OLLAMA CLOUD PRO (switched 2026-08-02;
# OpenRouter cancelled). OpenAI-compatible endpoint, marginal pilot cost $0.
# Key lives in .env (gitignored) as OLLAMA_API_KEY — NEVER paste a key here.
#
# Catalog discovered live from https://ollama.com/v1/models (18 cloud models,
# 2026-08-02). Usage-level rule: level 1-2 only, no 1T-class giants.
# H4 arms A/B = SAME weights with reasoning toggled (cleanest isolation).
# NOTE: qwen3 classic hybrid-think cloud model absent from catalog; per the
# mission's fallback rule A/B use deepseek-v4-flash (284B MoE / 13B active,
# Medium usage, documented think modes). qwen3.5:397b (Medium) taken as the
# different-family D entry. See docs/decisions.md D21.

models:
  - name: deepseek-v4-flash-think        # H4 arm 1: reasoning ON
    adapter: ollama_native               # /v1 ignores `think`; native honors it (D23)
    api_key_env: OLLAMA_API_KEY
    model: deepseek-v4-flash
    extra_body:
      think: true

  - name: deepseek-v4-flash-nothink      # H4 arm 2: SAME model id, reasoning OFF
    adapter: ollama_native               # /v1 ignores `think`; native honors it (D23)
    api_key_env: OLLAMA_API_KEY
    model: deepseek-v4-flash
    extra_body:
      think: false

  - name: gpt-oss-20b                    # level-1, P1-comparable
    adapter: openai_compatible
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    model: gpt-oss:20b
    invocation_style: native

  - name: qwen3.5-397b                   # different family, provider defaults
    adapter: openai_compatible
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    model: qwen3.5:397b
    invocation_style: native

  # -- offline pipeline proof only (not a model; see docs/decisions.md D9) ---
  # - name: fixtures-smoke
  #   adapter: fixtures
  #   fixtures_path: harness/tests/fixtures/model_outputs_pass.jsonl

  - name: frontier-gemini                # frontier arm (free tier; D27)
    adapter: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model: gemini-3.6-flash
    invocation_style: native
    inter_call_delay_s: 2
    timeout_s: 180
    transport_retries: 4
    transport_backoff_s: [15, 30, 60, 120]
