[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Arabic Failure Atlas harness: validator, deterministic scorers, runner"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema>=4",
    "hijridate>=2.3",
    "pyyaml>=6",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
